<!-- @dsCard group="Colors" viewport="700x160" name="Safira — Secundária" subtitle="Escala de 10 tons, base #1A6B94" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body);}
  .row{display:flex;height:80px;}
  .swatch{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;}
  .label{font-size:10px;font-weight:600;opacity:.75;}
  .hex{font-size:9px;font-family:var(--font-mono);opacity:.6;}
  .meta{display:flex;gap:16px;padding:8px 12px;background:var(--neutral-50);}
  .meta span{font-size:11px;color:var(--text-secondary);}
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:var(--safira-900);color:#fff"><span class="label">900</span><span class="hex">#062837</span></div>
  <div class="swatch" style="background:var(--safira-800);color:#fff"><span class="label">800</span><span class="hex">#0C4860</span></div>
  <div class="swatch" style="background:var(--safira-700);color:#fff"><span class="label">700</span><span class="hex">#126A89</span></div>
  <div class="swatch" style="background:var(--safira-600);color:#fff"><span class="label">600</span><span class="hex">#1A6B94</span></div>
  <div class="swatch" style="background:var(--safira-500);color:#fff"><span class="label">500</span><span class="hex">#2480AD</span></div>
  <div class="swatch" style="background:var(--safira-400);color:#062837"><span class="label">400</span><span class="hex">#4A9FC5</span></div>
  <div class="swatch" style="background:var(--safira-300);color:#062837"><span class="label">300</span><span class="hex">#7BBFD8</span></div>
  <div class="swatch" style="background:var(--safira-200);color:#062837"><span class="label">200</span><span class="hex">#AADAEC</span></div>
  <div class="swatch" style="background:var(--safira-100);color:#062837"><span class="label">100</span><span class="hex">#D4EFF8</span></div>
  <div class="swatch" style="background:var(--safira-50);color:#062837;border:1px solid var(--neutral-200)"><span class="label">50</span><span class="hex">#EAF8FD</span></div>
</div>
<div class="meta">
  <span>Cor secundária — badges info, links, ícones de suporte</span>
  <span>Base: <strong>#1A6B94</strong> (600)</span>
</div>
</body>
</html>
