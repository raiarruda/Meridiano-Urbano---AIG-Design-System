<!-- @dsCard group="Colors" viewport="700x160" name="Amber — Destaque" subtitle="Escala de 10 tons, base #E87D2C" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body);}
  .row{display:flex;height:80px;}
  .swatch{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;}
  .label{font-size:10px;font-weight:600;opacity:.75;}
  .hex{font-size:9px;font-family:var(--font-mono);opacity:.6;}
  .meta{display:flex;gap:16px;padding:8px 12px;background:var(--neutral-50);}
  .meta span{font-size:11px;color:var(--text-secondary);}
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:var(--amber-900);color:#fff"><span class="label">900</span><span class="hex">#7A3800</span></div>
  <div class="swatch" style="background:var(--amber-800);color:#fff"><span class="label">800</span><span class="hex">#A84E00</span></div>
  <div class="swatch" style="background:var(--amber-700);color:#fff"><span class="label">700</span><span class="hex">#C0620A</span></div>
  <div class="swatch" style="background:var(--amber-600);color:#fff"><span class="label">600</span><span class="hex">#D06E18</span></div>
  <div class="swatch" style="background:var(--amber-500);color:#fff"><span class="label">500</span><span class="hex">#E87D2C</span></div>
  <div class="swatch" style="background:var(--amber-400);color:#7A3800"><span class="label">400</span><span class="hex">#F09350</span></div>
  <div class="swatch" style="background:var(--amber-300);color:#7A3800"><span class="label">300</span><span class="hex">#F5AD7A</span></div>
  <div class="swatch" style="background:var(--amber-200);color:#7A3800"><span class="label">200</span><span class="hex">#F9CAA8</span></div>
  <div class="swatch" style="background:var(--amber-100);color:#7A3800"><span class="label">100</span><span class="hex">#FDE5CC</span></div>
  <div class="swatch" style="background:var(--amber-50);color:#7A3800;border:1px solid var(--neutral-200)"><span class="label">50</span><span class="hex">#FFF4EB</span></div>
</div>
<div class="meta">
  <span>Cor de destaque — CTAs, valores em foco, telhado do logo</span>
  <span>Base: <strong>#E87D2C</strong> (500)</span>
</div>
</body>
</html>
