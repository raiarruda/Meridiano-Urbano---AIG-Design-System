<!-- @dsCard group="Colors" viewport="700x160" name="Navy — Primária" subtitle="Escala de 10 tons, base #002445" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body);}
  .row{display:flex;height:80px;}
  .swatch{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;}
  .label{font-size:10px;font-weight:600;opacity:.75;}
  .hex{font-size:9px;font-family:var(--font-mono);opacity:.6;}
  .meta{display:flex;gap:16px;padding:8px 12px;background:var(--neutral-50);}
  .meta span{font-size:11px;color:var(--text-secondary);}
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:var(--navy-900);color:#fff"><span class="label">900</span><span class="hex">#001420</span></div>
  <div class="swatch" style="background:var(--navy-800);color:#fff"><span class="label">800</span><span class="hex">#002445</span></div>
  <div class="swatch" style="background:var(--navy-700);color:#fff"><span class="label">700</span><span class="hex">#0D2F57</span></div>
  <div class="swatch" style="background:var(--navy-600);color:#fff"><span class="label">600</span><span class="hex">#144B82</span></div>
  <div class="swatch" style="background:var(--navy-500);color:#fff"><span class="label">500</span><span class="hex">#1E5291</span></div>
  <div class="swatch" style="background:var(--navy-400);color:#fff"><span class="label">400</span><span class="hex">#3469A8</span></div>
  <div class="swatch" style="background:var(--navy-300);color:#002445"><span class="label">300</span><span class="hex">#6B95C8</span></div>
  <div class="swatch" style="background:var(--navy-200);color:#002445"><span class="label">200</span><span class="hex">#A8C2E0</span></div>
  <div class="swatch" style="background:var(--navy-100);color:#002445"><span class="label">100</span><span class="hex">#D7E5F8</span></div>
  <div class="swatch" style="background:var(--navy-50);color:#002445;border:1px solid var(--neutral-200)"><span class="label">50</span><span class="hex">#EEF4FC</span></div>
</div>
<div class="meta">
  <span>Cor primária da marca — fundos, textos, headers</span>
  <span>Base: <strong>#002445</strong> (800)</span>
</div>
</body>
</html>
