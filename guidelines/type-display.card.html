<!-- @dsCard group="Type" viewport="700x180" name="Display — Big Shoulders" subtitle="Hero, títulos de sistema, sempre em maiúsculas" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--white);font-family:var(--font-display);}
  .d1{font-size:72px;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--navy-800);}
  .d2{font-size:48px;font-weight:800;line-height:1.1;letter-spacing:-.02em;color:var(--amber-500);}
  .d3{font-size:36px;font-weight:700;line-height:1.1;letter-spacing:-.01em;color:var(--neutral-700);}
  .meta{margin-top:12px;display:flex;gap:24px;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);background:var(--neutral-100);padding:2px 8px;border-radius:var(--radius-sm);}
</style>
</head>
<body>
<div class="d1">AVALIAÇÃO</div>
<div class="d2">MERIDIANO</div>
<div class="d3">IMÓVEIS · SALVADOR</div>
<div class="meta">
  <span class="tag">Big Shoulders Display 900 — 72px</span>
  <span class="tag">tracking: -0.02em</span>
  <span class="tag">ALWAYS UPPERCASE</span>
</div>
</body>
</html>
