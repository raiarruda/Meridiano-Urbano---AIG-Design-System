<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--navy-900);font-family:var(--font-body);}
  .hero{padding:32px 40px 24px;text-align:center;}
  .tagline{font-family:var(--font-heading);font-size:22px;font-weight:700;color:var(--white);line-height:1.35;}
  .tagline em{color:var(--amber-500);font-style:normal;}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid rgba(255,255,255,.1);}
  .pillar{padding:16px 24px;}
  .pillar h4{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--amber-500);margin:0 0 6px;text-transform:uppercase;}
  .pillar p{font-size:13px;color:var(--neutral-300);margin:0;line-height:1.5;}
</style>
</head>
<body>
<div class="hero">
  <div class="tagline">"Precisão que se vê, <em>confiança que se sente.</em>"</div>
</div>
<div class="pillars">
  <div class="pillar">
    <h4>Precisão</h4>
    <p>Dados exatos. Grid rigoroso. Espaço como argumento.</p>
  </div>
  <div class="pillar" style="border-left:1px solid rgba(255,255,255,.1);border-right:1px solid rgba(255,255,255,.1)">
    <h4>Confiança</h4>
    <p>Consistência absoluta em cada interação.</p>
  </div>
  <div class="pillar">
    <h4>Clareza</h4>
    <p>Informação sem ruído. O número fala por si.</p>
  </div>
</div>
</body>
</html>
