<!-- @dsCard group="Spacing" viewport="700x140" name="Raios de Borda" subtitle="--radius-xs (2px) a --radius-full" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--white);font-family:var(--font-body);}
  .row{display:flex;align-items:center;gap:20px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:52px;height:52px;background:var(--navy-800);}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);text-align:center;}
  .sub{font-size:9px;color:var(--neutral-400);text-align:center;}
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="label">--xs</span><span class="sub">2px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="label">--sm</span><span class="sub">4px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="label">--md</span><span class="sub">6px · campos</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="label">--lg</span><span class="sub">8px · cards</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="label">--xl</span><span class="sub">12px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="label">--2xl</span><span class="sub">16px</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-full);width:52px;height:52px"></div><span class="label">--full</span><span class="sub">∞ · badges</span></div>
</div>
</body>
</html>
