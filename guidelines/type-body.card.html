<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--white);font-family:var(--font-body);}
  .body-lg{font-size:18px;font-weight:400;line-height:1.6;color:var(--text-primary);margin:0 0 6px;}
  .body-base{font-size:16px;font-weight:400;line-height:1.5;color:var(--text-secondary);margin:0 0 6px;}
  .body-sm{font-size:14px;font-weight:400;line-height:1.5;color:var(--text-muted);margin:0 0 6px;}
  .caption{font-size:12px;font-weight:500;line-height:1.4;color:var(--text-muted);letter-spacing:.01em;margin:0;}
  .row{display:flex;align-items:baseline;gap:16px;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);background:var(--neutral-100);padding:2px 8px;border-radius:var(--radius-sm);flex-shrink:0;}
</style>
</head>
<body>
<div class="row"><div class="body-lg">O valor do imóvel é calculado a partir do CUB vigente.</div><span class="tag">lg · 18px · 400</span></div>
<div class="row"><div class="body-base">Combinado com o VUPT e o índice INPC do logradouro.</div><span class="tag">base · 16px · 400</span></div>
<div class="row"><div class="body-sm">Preencha o formulário e receba o resultado por e-mail.</div><span class="tag">sm · 14px · 400</span></div>
<div class="row"><div class="caption">Campo obrigatório · Verifique os dados antes de continuar</div><span class="tag">caption · 12px · 500</span></div>
</body>
</html>
