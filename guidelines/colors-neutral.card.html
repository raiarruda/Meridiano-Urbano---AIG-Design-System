<!-- @dsCard group="Colors" viewport="700x160" name="Neutros" subtitle="Escala cinza-azulada, de #0A1E2A a #F8FAFC" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body);}
  .row{display:flex;height:80px;}
  .swatch{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;}
  .label{font-size:10px;font-weight:600;opacity:.75;}
  .hex{font-size:9px;font-family:var(--font-mono);opacity:.6;}
  .meta{display:flex;gap:16px;padding:8px 12px;background:var(--neutral-50);}
  .meta span{font-size:11px;color:var(--text-secondary);}
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:var(--neutral-900);color:#fff"><span class="label">900</span><span class="hex">#0A1E2A</span></div>
  <div class="swatch" style="background:var(--neutral-800);color:#fff"><span class="label">800</span><span class="hex">#161E2A</span></div>
  <div class="swatch" style="background:var(--neutral-700);color:#fff"><span class="label">700</span><span class="hex">#374457</span></div>
  <div class="swatch" style="background:var(--neutral-600);color:#fff"><span class="label">600</span><span class="hex">#4A5568</span></div>
  <div class="swatch" style="background:var(--neutral-500);color:#fff"><span class="label">500</span><span class="hex">#6B7280</span></div>
  <div class="swatch" style="background:var(--neutral-400);color:#161E2A"><span class="label">400</span><span class="hex">#9CA3AF</span></div>
  <div class="swatch" style="background:var(--neutral-300);color:#161E2A"><span class="label">300</span><span class="hex">#DAE1EC</span></div>
  <div class="swatch" style="background:var(--neutral-200);color:#161E2A"><span class="label">200</span><span class="hex">#E8EDF5</span></div>
  <div class="swatch" style="background:var(--neutral-100);color:#161E2A"><span class="label">100</span><span class="hex">#F0F3F8</span></div>
  <div class="swatch" style="background:var(--neutral-50);color:#161E2A;border:1px solid var(--neutral-200)"><span class="label">50</span><span class="hex">#F8FAFC</span></div>
</div>
<div class="meta">
  <span>Tom cinza-azulado — nunca cinza puro. Derivado do navy.</span>
</div>
</body>
</html>
