<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--navy-900);font-family:var(--font-mono);}
  .row{display:flex;align-items:baseline;gap:32px;margin-bottom:8px;}
  .val{font-size:32px;font-weight:400;letter-spacing:.02em;color:var(--white);}
  .pct{font-size:28px;font-weight:500;letter-spacing:.02em;color:var(--amber-500);}
  .code{font-size:22px;font-weight:400;letter-spacing:.04em;color:var(--neutral-400);}
  .tag{font-size:11px;color:var(--neutral-500);}
</style>
</head>
<body>
<div class="row">
  <span class="val">R$ 2.847,35</span>
  <span class="pct">2,70%</span>
  <span class="code">R-16 · Médio</span>
</div>
<div class="row">
  <span class="tag">Valor monetário · DM Mono 400 · 32px</span>
  <span class="tag">Percentual · amber-500</span>
  <span class="tag">Código de tipo · neutral-400</span>
</div>
</body>
</html>
