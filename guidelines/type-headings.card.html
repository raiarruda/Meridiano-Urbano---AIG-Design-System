<!-- @dsCard group="Type" viewport="700x200" name="Headings — Work Sans" subtitle="Títulos de conteúdo, tabelas, sub-seções" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--white);}
  .h1{font-family:var(--font-heading);font-size:30px;font-weight:700;line-height:1.25;letter-spacing:-.02em;color:var(--navy-800);margin:0 0 4px;}
  .h2{font-family:var(--font-heading);font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--navy-800);margin:0 0 4px;}
  .h3{font-family:var(--font-heading);font-size:20px;font-weight:600;line-height:1.25;color:var(--neutral-700);margin:0 0 4px;}
  .h4{font-family:var(--font-heading);font-size:16px;font-weight:600;line-height:1.25;color:var(--neutral-700);margin:0;}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:8px;}
  .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);background:var(--neutral-100);padding:2px 8px;border-radius:var(--radius-sm);flex-shrink:0;}
</style>
</head>
<body>
<div class="row"><div class="h1">Custo Unitário Básico por Tipo</div><span class="tag">H1 · 30px · 700</span></div>
<div class="row"><div class="h2">Tabela de Valores CUB — Mensal</div><span class="tag">H2 · 24px · 700</span></div>
<div class="row"><div class="h3">Configuração de Parâmetros da Fórmula</div><span class="tag">H3 · 20px · 600</span></div>
<div class="row"><div class="h4">Nome do Logradouro / Referência</div><span class="tag">H4 · 16px · 600</span></div>
</body>
</html>
