<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--neutral-100);font-family:var(--font-body);}
  .row{display:flex;align-items:center;gap:20px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:60px;height:52px;background:var(--white);border-radius:var(--radius-lg);}
  .label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);text-align:center;}
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="label">xs</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="label">sm</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="label">md · card</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="label">lg</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="label">xl · modal</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-amber);background:var(--amber-500)"></div><span class="label">amber glow</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-focus-navy);border:1.5px solid var(--navy-500)"></div><span class="label">focus navy</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-focus-error);border:1.5px solid var(--error-500)"></div><span class="label">focus erro</span></div>
</div>
</body>
</html>
