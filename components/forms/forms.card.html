<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--neutral-50); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .label { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); margin: 16px 0 10px; letter-spacing: .06em; text-transform: uppercase; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .divider { border: none; border-top: 1px solid var(--neutral-200); margin: 4px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox } = window.MeridianoUrbanoAIGDesignSystem_405b20;

function App() {
  const [val, setVal] = React.useState('R$ 2.847,35');
  const [tipo, setTipo] = React.useState('R-16');
  const [chk, setChk] = React.useState(true);

  return (
    <div>
      <div className="label">Inputs</div>
      <div className="grid">
        <Input label="Valor Configurado (R$/m²)" prefix="R$" value={val} onChange={e => setVal(e.target.value)} />
        <Input label="Nome do Logradouro" placeholder="usa oficial" />
        <Input label="Campo com erro" value="texto inválido" errorText="Campo obrigatório" required />
        <Input label="Campo desabilitado" value="R$ 3.201,18" disabled />
      </div>
      <hr className="divider" style={{marginTop: '16px'}} />
      <div className="label">Select</div>
      <div className="grid">
        <Select label="Tipo de Projeto" value={tipo} onChange={e => setTipo(e.target.value)}
          options={['R-16','R-1','PIS','RP1Q','PP-4']} />
        <Select label="Padrão" placeholder="Selecione o padrão..."
          options={[{value:'alto',label:'Alto'},{value:'medio',label:'Médio'},{value:'baixo',label:'Baixo'}]} />
      </div>
      <hr className="divider" style={{marginTop: '16px'}} />
      <div className="label">Checkbox</div>
      <div className="row">
        <Checkbox label="Usar valor oficial" checked={chk} onChange={e => setChk(e.target.checked)} />
        <Checkbox label="Exportar ao salvar" checked={false} onChange={() => {}} />
        <Checkbox label="Campo desabilitado" checked={true} disabled />
        <Checkbox label="Indeterminado" checked={false} indeterminate />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
